<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nuestra Ruleta</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ACTO 1 -->
  <section id="intro" class="activo">
    <p id="texto"></p>
    <button id="btn-jugar" onclick="irARecuerdos()">¿Jugamos?</button>
  </section>

  <!-- ACTO 2 -->
  <section id="recuerdos">
    <video autoplay muted loop>
      <source src="fondo.mp4" type="video/mp4">
    </video>

    <div class="fotos">
      <img src="foto1.jpg">
      <img src="foto2.jpg">
      <img src="foto3.jpg">
    </div>

    <button onclick="irARuleta()">Continuar</button>
  </section>

  <!-- ACTO 3 -->
  <section id="ruleta">
    <h1>🎡 Nuestra Ruleta</h1>
    <div class="circulo" onclick="girar()">♡</div>
    <p id="resultado">Pulsa el corazón</p>
    <p id="contador"></p>
  </section>


  <script src="script.js"></script>
</body>
</html>
