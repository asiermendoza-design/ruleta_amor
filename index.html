<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta Romántica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- TEXTO INICIAL -->
  <section id="intro" class="activo">
    <p id="texto"></p>
    <button id="btn-jugar" onclick="iniciarJuego()">¡Jugar!</button>
  </section>

  <!-- RULETA -->
  <section id="ruleta">
    <h1>🎡 Nuestra Ruleta</h1>
    <div class="circulo" onclick="girar()">♡</div>
    <p id="resultado">Pulsa el corazón para girar</p>
    <p id="contador"></p>
  </section>

  <!-- MÚSICA DE FONDO -->
  <audio id="musica" loop autoplay>
    <source src="musica.mp3" type="audio/mpeg">
    Tu navegador no soporta audio.
  </audio>

  <script src="script.js"></script>
</body>
</html>
